# Hébergement de secours chez Render (pendant la panne de Systalink, novembre 2026).
# Render lit ce fichier (« Blueprint ») : il crée la base PostgreSQL et le site, et relie les deux.
# Aucun secret n'est écrit ici : l'adresse de la base vient de Render, la clé JWT est tirée au hasard par Render.
databases:
  - name: palabre-db
    plan: free
    region: frankfurt
    databaseName: palabre
    user: palabre

services:
  - type: web
    name: palabre-cadev
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --omit=dev
    # Le contenu de démonstration (comptes du jury, --forcer car on est en production) est créé au démarrage s'il n'existe pas encore ; il ne fait rien sinon.
    startCommand: npm run demo -- --forcer; npm start
    healthCheckPath: /api/sante
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: palabre-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
