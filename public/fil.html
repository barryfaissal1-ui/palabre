<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171512">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Palabre">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <title>Fil d'actualité – Palabre</title>
  <script src="/js/app.js" defer></script>
  <script src="/js/fil.js" defer></script>
</head>
<body>
  <div class="bande"></div>
  <header class="conteneur entete">
    <a class="marque" href="/"><img src="/icons/logo-256.png" alt="" width="36" height="36">Palabre</a>
    <nav data-nav></nav>
  </header>
  <main class="conteneur page-fil">
    <h1 class="titre-page">Fil d'actualité</h1>

    <!-- Zone « Publier » : un champ compact ; le reste (.composer-suite) apparaît quand on touche le champ. -->
    <form class="bloc-formulaire composer" data-publier novalidate>
      <div class="composer-champ">
        <span data-mon-avatar></span>
        <div class="champ">
          <label class="visuellement-cache" for="texte">Ta publication</label>
          <textarea id="texte" name="texte" rows="1" maxlength="3000" placeholder="Quoi de neuf ?"></textarea>
          <p class="erreur-champ" data-erreur="texte"></p>
        </div>
      </div>
      <div class="composer-suite">
        <fieldset class="choix-puces">
          <legend class="visuellement-cache">Type de publication</legend>
          <input type="radio" name="type" id="type-idee" value="idee" checked>
          <label for="type-idee"><svg class="icone" aria-hidden="true"><use href="/icons/icones.svg#idee"></use></svg>Idée</label>
          <input type="radio" name="type" id="type-question" value="question">
          <label for="type-question"><svg class="icone" aria-hidden="true"><use href="/icons/icones.svg#question"></use></svg>Question</label>
          <input type="radio" name="type" id="type-projet" value="projet">
          <label for="type-projet"><svg class="icone" aria-hidden="true"><use href="/icons/icones.svg#projet"></use></svg>Projet</label>
        </fieldset>
        <div class="apercu-image" data-apercu hidden>
          <img alt="Aperçu de l'image choisie" data-apercu-image>
          <button class="bouton bouton-lien" type="button" data-retirer-image>Retirer l'image</button>
        </div>
        <div class="actions-publier">
          <label class="bouton bouton-contour">
            <svg class="icone" aria-hidden="true"><use href="/icons/icones.svg#image"></use></svg>Image
            <input type="file" accept="image/*" data-choisir-image class="visuellement-cache">
          </label>
          <button class="bouton bouton-principal" type="submit"><svg class="icone" aria-hidden="true"><use href="/icons/icones.svg#envoyer"></use></svg>Publier</button>
        </div>
      </div>
      <p class="message" role="status" data-message></p>
    </form>

    <div class="onglets" role="group" aria-label="Filtrer le fil">
      <button class="onglet" type="button" data-filtre="tout" aria-pressed="true">Tout le monde</button>
      <button class="onglet" type="button" data-filtre="amis" aria-pressed="false">Mes amis</button>
    </div>

    <div class="liste-publications" data-fil></div>
    <div role="status" data-etat-fil hidden></div>
    <button class="bouton bouton-contour bouton-plein" type="button" data-charger-plus hidden>Voir plus de publications</button>
  </main>
</body>
</html>
