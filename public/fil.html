<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171512">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Palabre">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <title>Fil d'actualité – Palabre</title>
  <script src="/js/app.js" defer></script>
  <script src="/js/publication.js" defer></script>
  <script src="/js/fil.js" defer></script>
</head>
<body>
  <div class="bande"></div>
  <header class="entete"><div class="conteneur entete-interieur">
    <a class="marque" href="/"><img src="/icons/logo-256.png" alt="" width="32" height="32">Palabre</a>
    <nav data-nav></nav>
  </div></header>
  <main class="conteneur page-fil">
    <h1 class="visuellement-cache">Fil d'actualité</h1>

    <!-- Zone « Publier » : un champ compact et trois raccourcis ; le reste (.composer-suite) apparaît quand on écrit. -->
    <form class="bloc-fil composer" data-publier novalidate>
      <div class="composer-champ">
        <span data-mon-avatar></span>
        <div class="champ">
          <label class="visuellement-cache" for="texte">Ta publication</label>
          <textarea id="texte" name="texte" rows="1" maxlength="3000" placeholder="Quoi de neuf ?"></textarea>
          <p class="erreur-champ" data-erreur="texte"></p>
        </div>
      </div>
      <div class="composer-suite">
        <fieldset class="choix-puces">
          <legend class="visuellement-cache">Type de publication</legend>
          <input type="radio" name="type" id="type-idee" value="idee" checked>
          <label for="type-idee"><svg class="icone" aria-hidden="true"><use href="/icons/icones.svg#idee"></use></svg>Idée</label>
          <input type="radio" name="type" id="type-question" value="question">
          <label for="type-question"><svg class="icone" aria-hidden="true"><use href="/icons/icones.svg#question"></use></svg>Question</label>
          <input type="radio" name="type" id="type-projet" value="projet">
          <label for="type-projet"><svg class="icone" aria-hidden="true"><use href="/icons/icones.svg#projet"></use></svg>Projet</label>
        </fieldset>
        <div class="apercu-image" data-apercu hidden>
          <img alt="Aperçu de l'image choisie" data-apercu-image>
          <button class="bouton bouton-lien" type="button" data-retirer-image>Retirer l'image</button>
        </div>
        <!-- Lien vidéo (YouTube, TikTok, Facebook) : ouvert par le bouton « Vidéo ». L'aperçu est dessiné par fil.js
             une fois que le serveur a reconnu le lien. -->
        <div class="champ zone-video" data-zone-video hidden>
          <label for="video">Lien de la vidéo <span class="aide">YouTube, TikTok ou Facebook</span></label>
          <div class="ligne-video">
            <input id="video" name="video" type="url" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="300" placeholder="https://youtu.be/…">
            <button class="bouton bouton-lien" type="button" data-retirer-video>Retirer</button>
          </div>
          <p class="erreur-champ" data-erreur="video"></p>
          <div data-apercu-video></div>
        </div>
        <div class="actions-publier">
          <div class="actions-joindre">
            <label class="bouton bouton-contour" for="choisir-image"><svg class="icone" aria-hidden="true"><use href="/icons/icones.svg#image"></use></svg>Image</label>
            <button class="bouton bouton-contour" type="button" data-ouvrir-video aria-expanded="false"><svg class="icone" aria-hidden="true"><use href="/icons/icones.svg#video"></use></svg>Vidéo</button>
          </div>
          <button class="bouton bouton-principal" type="submit"><svg class="icone" aria-hidden="true"><use href="/icons/icones.svg#envoyer"></use></svg>Publier</button>
        </div>
      </div>
      <p class="message" role="status" data-message></p>
      <!-- Raccourcis : ils préchoisissent le type de publication (ou ouvrent le choix d'une photo). -->
      <div class="composer-raccourcis">
        <label class="raccourci raccourci-photo" for="choisir-image"><svg class="icone" aria-hidden="true"><use href="/icons/icones.svg#image"></use></svg>Photo</label>
        <button class="raccourci raccourci-video" type="button" data-ouvrir-video><svg class="icone" aria-hidden="true"><use href="/icons/icones.svg#video"></use></svg>Vidéo</button>
        <button class="raccourci raccourci-question" type="button" data-raccourci="question"><svg class="icone" aria-hidden="true"><use href="/icons/icones.svg#question"></use></svg>Question</button>
        <button class="raccourci raccourci-projet" type="button" data-raccourci="projet"><svg class="icone" aria-hidden="true"><use href="/icons/icones.svg#projet"></use></svg>Projet</button>
      </div>
      <input type="file" id="choisir-image" accept="image/*" data-choisir-image class="visuellement-cache" aria-label="Choisir une image">
    </form>

    <!-- « Disponibles maintenant » : remplie par fil.js, cachée s'il n'y a personne. -->
    <section class="bloc-fil disponibles" data-disponibles aria-labelledby="titre-disponibles" hidden>
      <h2 id="titre-disponibles">Disponibles maintenant</h2>
      <ul class="rangee-disponibles" data-rangee></ul>
    </section>

    <div class="bloc-fil filtres-fil" role="group" aria-label="Filtrer le fil">
      <button class="filtre-fil" type="button" data-filtre="tout" aria-pressed="true">Tout le monde</button>
      <button class="filtre-fil" type="button" data-filtre="amis" aria-pressed="false">Mes amis</button>
    </div>

    <div class="fil-social" data-fil></div>
    <div role="status" data-etat-fil hidden></div>
    <button class="bouton bouton-contour bouton-plein charger-plus" type="button" data-charger-plus hidden>Voir plus de publications</button>
  </main>
</body>
</html>
