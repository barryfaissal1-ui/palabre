<!-- Défi de la semaine : l'énoncé, les réponses des devs, puis le vote. Tout est dessiné par defis.js

<body>
  <div class="bande"></div>
  <header class="entete"><div class="conteneur entete-interieur">
    <a class="marque" href="/"><img src="/icons/logo-96.webp" alt="" width="32" height="32">Palabre</a>
    <nav data-nav></nav>
  </div></header>
  <main class="conteneur page-fil">
    <h1 data-t="nav.defi" class="titre-page">Défi de la semaine</h1>
    <div data-defi aria-live="polite">
      <div class="squelettes" aria-hidden="true">
        <div class="squelette"><span class="os os-moyen"></span><span class="os"></span><span class="os os-court"></span></div>
        <div class="squelette"><div class="squelette-entete"><span class="os os-rond"></span><span class="os os-court"></span></div><span class="os"></span></div>
      </div>
      <p data-t="commun.chargement" class="visuellement-cache">Chargement…</p>
    </div>
