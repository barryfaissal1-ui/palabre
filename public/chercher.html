<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171512">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Palabre">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <title>Trouver un développeur – Palabre</title>
  <meta name="description" content="Cherche un développeur africain par compétence, pays, ville et disponibilité, avec ses projets vérifiés et les avis de ses clients.">
  <script src="/js/app.js" defer></script>
  <script src="/js/chercher.js" defer></script>
</head>
<body>
  <div class="bande"></div>
  <header class="conteneur entete">
    <a class="marque" href="/"><img src="/icons/logo-256.png" alt="" width="36" height="36">Palabre</a>
    <nav data-nav></nav>
  </header>
  <main class="conteneur page-fil">
    <h1 class="titre-page">Trouver un développeur</h1>

    <form class="bloc-formulaire" data-recherche role="search">
      <div class="champ">
        <label for="competence">Compétence</label>
        <select id="competence" name="competence">
          <option value="">Toutes les compétences</option>
        </select>
      </div>
      <div class="champ">
        <label for="pays">Pays</label>
        <select id="pays" name="pays">
          <option value="">Tous les pays</option>
        </select>
      </div>
      <div class="champ">
        <label for="ville">Ville</label>
        <input id="ville" name="ville" maxlength="60" autocomplete="off" placeholder="Ex. Ouagadougou">
      </div>
      <label class="case-a-cocher">
        <input type="checkbox" name="disponible">
        <span>Seulement les devs disponibles</span>
      </label>
      <button class="bouton bouton-principal bouton-plein" type="submit">Chercher</button>
    </form>

    <p class="texte-discret etat-fil" role="status" data-etat>Chargement…</p>
    <div class="liste-publications" data-resultats></div>
    <button class="bouton bouton-contour bouton-plein" type="button" data-charger-plus hidden>Voir plus de développeurs</button>
  </main>
</body>
</html>
