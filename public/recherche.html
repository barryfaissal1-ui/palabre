<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171512">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <title>Recherche – Palabre</title>
  <script src="/langues/fr.js" defer></script>
  <script src="/langues/en.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/publication.js" defer></script>
  <script src="/js/recherche.js" defer></script>
</head>
<body>
  <div class="bande"></div>
  <header class="entete"><div class="conteneur entete-interieur">
    <a class="marque" href="/"><img src="/icons/logo-96.webp" alt="" width="32" height="32">Palabre</a>
    <nav data-nav></nav>
  </div></header>
  <main class="conteneur page-fil">
    <h1 data-t="recherche.page-titre" class="visuellement-cache">Recherche dans les publications</h1>

    <!-- La question tapée et le filtre par type. Les résultats sont demandés au serveur par recherche.js. -->
    <form class="bloc-fil recherche-page" data-recherche role="search" novalidate>
      <label data-t="recherche.dans-publications" class="visuellement-cache" for="q">Chercher dans les publications</label>
      <div class="ligne-recherche">
        <input id="q" name="q" type="search" maxlength="100" autocomplete="off" enterkeyhint="search" placeholder="Une question, un outil, un sujet…" data-t-placeholder="recherche.exemple">
        <button class="bouton bouton-principal" type="submit" aria-label="Chercher" data-t-aria-label="chercher.bouton"><svg class="icone" aria-hidden="true"><use href="/icons/icones.svg#recherche"></use></svg></button>
      </div>
      <div class="puces-type" role="group" aria-label="Filtrer par type" data-t-aria-label="fil.filtrer-type">
        <button data-t="fil.type.tout" class="puce-type" type="button" data-type="" aria-pressed="true">Tout</button>
        <button data-t="fil.type.questions" class="puce-type" type="button" data-type="question" aria-pressed="false">Questions</button>
        <button data-t="fil.type.sans-reponse" class="puce-type" type="button" data-type="sans-reponse" aria-pressed="false">Sans réponse</button>
        <button data-t="fil.type.idees" class="puce-type" type="button" data-type="idee" aria-pressed="false">Idées</button>
        <button data-t="fil.type.projets" class="puce-type" type="button" data-type="projet" aria-pressed="false">Projets</button>
      </div>
    </form>

    <!-- Les membres dont le nom correspond : trois au plus, remplis par recherche.js. -->
    <section class="bloc-fil recherche-membres" data-membres aria-labelledby="titre-membres" hidden>
      <h2 data-t="recherche.membres" id="titre-membres">Membres</h2>
      <ul class="liste-recherche" data-liste-membres></ul>
    </section>

    <h2 data-t="recherche.publications" class="titre-partie" data-titre-publications hidden>Publications</h2>
    <div class="fil-social" data-fil></div>
    <div role="status" data-etat-fil hidden></div>
    <button data-t="fil.voir-plus" class="bouton bouton-contour bouton-plein charger-plus" type="button" data-charger-plus hidden>Voir plus de publications</button>
  </main>
</body>
</html>
