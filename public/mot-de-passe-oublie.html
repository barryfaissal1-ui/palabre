<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171512">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Palabre">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <title>Mot de passe oublié – Palabre</title>
  <script src="/js/app.js" defer></script>
  <script src="/js/formulaires.js" defer></script>
</head>
<body class="page-formulaire">
  <div>
    <div class="bande"></div>
    <header class="entete"><div class="conteneur entete-interieur">
      <a class="marque" href="/"><img src="/icons/logo-256.png" alt="" width="32" height="32">Palabre</a>
    </div></header>
  </div>
  <main class="conteneur">
    <div class="carte-formulaire">
      <h1>Mot de passe oublié</h1>
      <p class="sous-titre">Indique ton email : tu recevras un lien pour choisir un nouveau mot de passe.</p>
      <form data-formulaire="mot-de-passe-oublie" novalidate>
        <div class="champ">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
          <p class="erreur-champ" data-erreur="email"></p>
        </div>
        <p class="message" role="alert" data-message></p>
        <button class="bouton bouton-principal bouton-plein" type="submit">Envoyer le lien</button>
      </form>
      <div class="liens-formulaire">
        <p><a href="/connexion">Retour à la connexion</a></p>
      </div>
    </div>
  </main>
</body>
</html>
