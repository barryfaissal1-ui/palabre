<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F2A5C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Palabre">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <title>Se connecter – Palabre</title>
  <script src="/js/app.js" defer></script>
  <script src="/js/formulaires.js" defer></script>
</head>
<body class="page-formulaire">
  <div>
    <div class="bande"></div>
    <header class="conteneur entete">
      <a class="marque" href="/"><img src="/icons/logo-256.png" alt="" width="36" height="36">Palabre</a>
    </header>
  </div>
  <main class="conteneur">
    <div class="carte-formulaire">
      <h1>Bon retour</h1>
      <p class="sous-titre">Connecte-toi pour retrouver ton fil et tes demandes.</p>

      <form data-formulaire="connexion" novalidate>
        <div class="champ">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
          <p class="erreur-champ" data-erreur="email"></p>
        </div>
        <div class="champ">
          <label for="motDePasse">Mot de passe</label>
          <input id="motDePasse" name="motDePasse" type="password" autocomplete="current-password" required>
          <p class="erreur-champ" data-erreur="motDePasse"></p>
        </div>
        <p class="message" role="alert" data-message></p>
        <button class="bouton bouton-principal bouton-plein" type="submit">Se connecter</button>
      </form>

      <div class="liens-formulaire">
        <p><a href="/mot-de-passe-oublie">Mot de passe oublié ?</a></p>
        <p>Pas encore de compte ? <a href="/inscription">Créer un compte</a></p>
      </div>
    </div>
  </main>
</body>
</html>
