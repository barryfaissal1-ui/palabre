<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F3D22">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/confirmer-email.css">
  <title>Confirme ton email – Palabre</title>
  <script src="/langues/fr.js" defer></script>
  <script src="/langues/en.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/confirmer-email.js" defer></script>
</head>
<!-- Étape 1 de l'inscription, pour tout le monde : saisir le code à 6 chiffres reçu par email.
     Tant que ce n'est pas fait, le serveur refuse tout le reste (src/middleware/auth.js, exigerEmailConfirme).
     « Les feuilles de l'arbre à palabres » : la carte est une grande feuille, chaque chiffre s'écrit sur une petite
     feuille. Pendant la vérification elles tourbillonnent ; si le code est bon, elles forment la couronne d'un arbre.
     Styles : css/confirmer-email.css (chargé par cette page seulement). Mouvement : js/confirmer-email.js. -->
<body class="page-feuille">
  <main class="scene-feuille">
    <div class="grande-feuille" data-grande-feuille>
      <span class="feuille-eclat" aria-hidden="true"></span>
      <!-- Nervures de la grande feuille, presque invisibles derrière le texte -->
      <svg class="feuille-nervure" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M3 3C30 34 66 68 97 97"/>
        <path d="M22 22C30 20 40 12 46 4M22 22C20 30 12 40 4 46M42 42C54 38 68 26 76 12M42 42C38 54 26 68 12 76M62 62C74 58 86 48 94 36M62 62C58 74 48 86 36 94"/>
      </svg>
      <!-- La queue de la feuille (pétiole), qui sort de la pointe du bas -->
      <svg class="feuille-petiole" viewBox="0 0 44 48" aria-hidden="true"><path d="M5 5C17 12 30 26 38 43"/></svg>

      <div class="feuille-contenu">
        <span class="medaillon" aria-hidden="true"><svg class="icone"><use href="/icons/icones.svg#feuille"></use></svg></span>
        <h1 data-t="code.titre" class="feuille-titre" data-titre>Confirme ton email</h1>
        <p class="feuille-texte" data-texte><span data-t="code.entre">Entre le code à 6 chiffres envoyé à</span> <strong data-t="code.ton-adresse" data-email>ton adresse</strong>.</p>

        <form data-code novalidate>
          <!-- Une petite feuille par chiffre. Seule sa forme est inclinée : le chiffre reste droit. -->
          <div class="branche" role="group" aria-label="Code à 6 chiffres" data-t-aria-label="code.six-chiffres" data-branche>
            <span class="petite-feuille" data-feuille><span class="petite-forme" aria-hidden="true"><span class="petite-vive"></span><span class="petite-seche"></span></span><input class="chiffre" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" aria-label="Chiffre 1 sur 6" data-t-aria-label="code.chiffre-1"></span>
            <span class="petite-feuille" data-feuille><span class="petite-forme" aria-hidden="true"><span class="petite-vive"></span><span class="petite-seche"></span></span><input class="chiffre" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Chiffre 2 sur 6" data-t-aria-label="code.chiffre-2"></span>
            <span class="petite-feuille" data-feuille><span class="petite-forme" aria-hidden="true"><span class="petite-vive"></span><span class="petite-seche"></span></span><input class="chiffre" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Chiffre 3 sur 6" data-t-aria-label="code.chiffre-3"></span>
            <span class="petite-feuille" data-feuille><span class="petite-forme" aria-hidden="true"><span class="petite-vive"></span><span class="petite-seche"></span></span><input class="chiffre" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Chiffre 4 sur 6" data-t-aria-label="code.chiffre-4"></span>
            <span class="petite-feuille" data-feuille><span class="petite-forme" aria-hidden="true"><span class="petite-vive"></span><span class="petite-seche"></span></span><input class="chiffre" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Chiffre 5 sur 6" data-t-aria-label="code.chiffre-5"></span>
            <span class="petite-feuille" data-feuille><span class="petite-forme" aria-hidden="true"><span class="petite-vive"></span><span class="petite-seche"></span></span><input class="chiffre" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Chiffre 6 sur 6" data-t-aria-label="code.chiffre-6"></span>
            <!-- L'arbre à palabres, caché tant que le code n'est pas confirmé : un tronc, puis le badge « vérifié ». -->
            <span class="arbre" aria-hidden="true">
              <svg class="tronc" viewBox="0 0 60 70" data-tronc><path d="M25 70c2-14 2-26-1-36l-8-14 4-2 7 11 3-16h4l-1 18 8-12 4 3-9 14c-2 9-2 21 0 34z"/></svg>
              <span class="onde" data-onde></span>
              <span class="badge-coche" data-coche><svg class="icone"><use href="/icons/icones.svg#valide"></use></svg></span>
            </span>
          </div>
          <p class="erreur-champ" data-erreur="code" role="alert"></p>
          <p class="visuellement-cache" aria-live="polite" data-annonce></p>
          <!-- Validation en deux étapes seulement (?motif=connexion) : ne plus demander de code sur cet appareil. -->
          <label class="feuille-confiance" data-confiance hidden><input type="checkbox" name="confiance"><span data-t="code.confiance">Faire confiance à cet appareil</span></label>
          <button class="bouton bouton-principal bouton-plein" type="submit" data-confirmer><span class="rond-attente" aria-hidden="true" hidden></span><span data-t="commun.confirmer" data-libelle>Confirmer</span></button>
        </form>

        <p class="feuille-renvoi"><span data-t="code.rien-recu">Tu n'as rien reçu ?</span> <button data-t="code.renvoyer" class="bouton bouton-lien" type="button" data-renvoyer>Renvoyer le code</button></p>
        <!-- Validation en deux étapes seulement : plus d'accès à sa boîte email ? Un des 8 codes de secours. -->
        <div class="feuille-secours" data-zone-secours hidden>
          <button data-t="code.secours.ouvrir" class="bouton bouton-lien" type="button" data-ouvrir-secours>Utiliser un code de secours</button>
          <form data-secours hidden novalidate>
            <label data-t="code.secours.label" for="secours">Code de secours</label>
            <input id="secours" name="secours" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="12">
            <p class="erreur-champ" data-erreur="secours" role="alert"></p>
            <button data-t="code.secours.valider" class="bouton bouton-contour bouton-plein" type="submit">Valider ce code</button>
          </form>
        </div>
        <p class="feuille-sortie"><button data-t="code.mauvaise-adresse" class="bouton bouton-lien" type="button" data-deconnexion>Mauvaise adresse ? Se déconnecter</button></p>
      </div>
    </div>
  </main>
</body>
</html>
