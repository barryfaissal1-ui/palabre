<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F2A5C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Palabre">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <title>Créer un compte – Palabre</title>
  <script src="/js/app.js" defer></script>
  <script src="/js/formulaires.js" defer></script>
</head>
<body class="page-formulaire">
  <div>
    <div class="bande"></div>
    <header class="conteneur entete">
      <a class="marque" href="/"><img src="/icons/logo-256.png" alt="" width="36" height="36">Palabre</a>
    </header>
  </div>
  <main class="conteneur">
    <div class="carte-formulaire">
      <h1>Créer ton compte</h1>
      <p class="sous-titre">Gratuit, et ça prend une minute.</p>

      <form data-formulaire="inscription" novalidate>
        <fieldset class="choix-type champ">
          <legend>Tu es</legend>
          <input type="radio" name="type" id="type-dev" value="dev" checked>
          <label for="type-dev"><strong>Développeur</strong><span>Je montre mon travail et je réponds aux demandes</span></label>
          <input type="radio" name="type" id="type-client" value="client">
          <label for="type-client"><strong>Client</strong><span>J'ai un projet et je cherche un dev</span></label>
        </fieldset>

        <div class="champ">
          <label for="nom">Nom complet</label>
          <input id="nom" name="nom" autocomplete="name" required minlength="2" maxlength="80">
          <p class="erreur-champ" data-erreur="nom"></p>
        </div>

        <div class="champ">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
          <p class="erreur-champ" data-erreur="email"></p>
        </div>

        <div class="champ">
          <label for="motDePasse">Mot de passe</label>
          <input id="motDePasse" name="motDePasse" type="password" autocomplete="new-password" required minlength="8">
          <span class="aide">8 caractères minimum.</span>
          <p class="erreur-champ" data-erreur="motDePasse"></p>
        </div>

        <div class="champ">
          <label for="pays">Pays</label>
          <select id="pays" name="pays" required data-liste-pays>
            <option value="Burkina Faso">Burkina Faso</option>
          </select>
          <p class="erreur-champ" data-erreur="pays"></p>
        </div>

        <div class="champ">
          <label for="ville">Ville</label>
          <input id="ville" name="ville" autocomplete="address-level2" required>
          <p class="erreur-champ" data-erreur="ville"></p>
        </div>

        <div class="champ">
          <label for="whatsapp">Numéro WhatsApp <span class="aide">(facultatif)</span></label>
          <input id="whatsapp" name="whatsapp" type="tel" autocomplete="tel" inputmode="tel" placeholder="+226 70 00 00 00">
          <span class="aide">Les clients pourront te contacter directement.</span>
          <p class="erreur-champ" data-erreur="whatsapp"></p>
        </div>

        <p class="message" role="alert" data-message></p>
        <button class="bouton bouton-principal bouton-plein" type="submit">Créer mon compte</button>
      </form>

      <div class="liens-formulaire">
        <p>Déjà inscrit ? <a href="/connexion">Se connecter</a></p>
      </div>
    </div>
  </main>
</body>
</html>
