<!-- Illustrations des états vides de Palabre. Dessinées par l'équipe Palabre pour le concours (aucune source externe).
     Couleurs du logo : terre cuite #C8623F, verts #187A3B et #22A04B, crème #F7F1E6.
     « currentColor » prend la couleur du texte : l'illustration s'adapte au mode clair et au mode sombre.
     Utilisation : <svg class="illustration"><use href="/icons/illustrations.svg#palabre"></use></svg> -->
<svg xmlns="http://www.w3.org/2000/svg">
  <!-- L'arbre à palabres : deux personnes assises sous l'arbre -->
  <symbol id="palabre" viewBox="0 0 160 120">
    <ellipse cx="80" cy="104" rx="62" ry="8" fill="#C8623F" opacity=".25"/>
    <path d="M76 102c1-18 0-32-4-44h16c-4 12-5 26-4 44z" fill="currentColor"/>
    <circle cx="56" cy="46" r="22" fill="#187A3B"/>
    <circle cx="104" cy="46" r="22" fill="#187A3B"/>
    <circle cx="80" cy="30" r="26" fill="#22A04B"/>
    <circle cx="38" cy="84" r="6" fill="#C8623F"/>
    <path d="M28 103c0-8 4-13 10-13s10 5 10 13z" fill="#C8623F"/>
    <circle cx="122" cy="84" r="6" fill="#C8623F"/>
    <path d="M112 103c0-8 4-13 10-13s10 5 10 13z" fill="#C8623F"/>
  </symbol>
  <!-- Deux amis côte à côte -->
  <symbol id="amis" viewBox="0 0 160 120">
    <ellipse cx="80" cy="104" rx="62" ry="8" fill="#22A04B" opacity=".2"/>
    <circle cx="104" cy="50" r="14" fill="#22A04B"/>
    <path d="M80 102c0-18 10-28 24-28s24 10 24 28z" fill="#22A04B"/>
    <circle cx="58" cy="44" r="16" fill="#C8623F"/>
    <path d="M30 102c0-20 12-32 28-32s28 12 28 32z" fill="#C8623F"/>
  </symbol>
  <!-- Une loupe sur une liste -->
  <symbol id="recherche" viewBox="0 0 160 120">
    <rect x="20" y="22" width="84" height="20" rx="6" fill="#22A04B" opacity=".25"/>
    <rect x="20" y="50" width="84" height="20" rx="6" fill="#C8623F" opacity=".25"/>
    <rect x="20" y="78" width="84" height="20" rx="6" fill="#22A04B" opacity=".25"/>
    <circle cx="100" cy="60" r="24" fill="none" stroke="currentColor" stroke-width="7"/>
    <path d="M118 78l20 20" fill="none" stroke="#C8623F" stroke-width="9" stroke-linecap="round"/>
  </symbol>
  <!-- Une cloche au repos -->
  <symbol id="calme" viewBox="0 0 160 120">
    <ellipse cx="80" cy="106" rx="56" ry="7" fill="#C8623F" opacity=".2"/>
    <path d="M80 18c-18 0-30 14-30 32v18L40 84h80l-10-16V50c0-18-12-32-30-32z" fill="#C8623F"/>
    <circle cx="80" cy="92" r="9" fill="currentColor"/>
    <circle cx="120" cy="28" r="8" fill="#22A04B"/>
    <circle cx="134" cy="46" r="5" fill="#22A04B" opacity=".6"/>
  </symbol>
  <!-- Une fenêtre de site ou d'application -->
  <symbol id="projets" viewBox="0 0 160 120">
    <rect x="22" y="18" width="116" height="84" rx="10" fill="#22A04B" opacity=".2"/>
    <path d="M32 18h96a10 10 0 0 1 10 10v10H22V28a10 10 0 0 1 10-10z" fill="#187A3B"/>
    <circle cx="36" cy="28" r="4" fill="#F7F1E6"/>
    <circle cx="50" cy="28" r="4" fill="#F7F1E6"/>
    <rect x="36" y="50" width="40" height="38" rx="6" fill="#C8623F"/>
    <rect x="86" y="50" width="38" height="8" rx="4" fill="currentColor" opacity=".6"/>
    <rect x="86" y="66" width="28" height="8" rx="4" fill="currentColor" opacity=".35"/>
    <rect x="86" y="80" width="34" height="8" rx="4" fill="currentColor" opacity=".35"/>
  </symbol>
  <!-- Une demande : une feuille et sa réponse -->
  <symbol id="demandes" viewBox="0 0 160 120">
    <rect x="40" y="12" width="76" height="96" rx="10" fill="#C8623F" opacity=".22"/>
    <rect x="52" y="28" width="52" height="8" rx="4" fill="#C8623F"/>
    <rect x="52" y="46" width="40" height="8" rx="4" fill="currentColor" opacity=".4"/>
    <rect x="52" y="62" width="46" height="8" rx="4" fill="currentColor" opacity=".4"/>
    <circle cx="112" cy="90" r="18" fill="#22A04B"/>
    <path d="M103 90l6 6 11-12" fill="none" stroke="#F7F1E6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
