<!-- Petits dessins au trait du fond des pages de connexion et d'inscription, sur le thème des développeurs.
     Un seul fichier : public/js/acces.js y pioche chaque dessin avec <use href="/icons/motif-acces.svg#nom">.
     La couleur, l'épaisseur du trait et l'opacité viennent du CSS (.motif-acces).
     Les tracés suivis d'un nom en anglais reprennent une icône Lucide 1.53.0 (licence ISC, voir LICENSE-LUCIDE.txt), sans modification ;
     ceux marqués « dessin de l'équipe » ont été tracés pour Palabre, dans le même style. -->
