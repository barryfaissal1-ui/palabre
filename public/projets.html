<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171512">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Palabre">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <title>Mes projets – Palabre</title>
  <script src="/js/app.js" defer></script>
  <script src="/js/projets.js" defer></script>
</head>
<body>
  <div class="bande"></div>
  <header class="conteneur entete">
    <a class="marque" href="/"><img src="/icons/logo-256.png" alt="" width="36" height="36">Palabre</a>
    <nav data-nav></nav>
  </header>
  <main class="conteneur page-fil">
    <h1 class="titre-page">Mes projets</h1>
    <p class="texte-discret intro-page">Montre ce que tu as déjà construit. Si le lien de ton projet répond, il reçoit le badge « Lien vérifié ».</p>

    <form class="bloc-formulaire" data-ajouter novalidate>
      <h2>Ajouter un projet</h2>
      <div class="champ">
        <label for="titre">Titre</label>
        <input id="titre" name="titre" maxlength="100" placeholder="Ex. Gestion de stock pour pharmacie">
        <p class="erreur-champ" data-erreur="titre"></p>
      </div>
      <div class="champ">
        <label for="secteur">Secteur</label>
        <select id="secteur" name="secteur"></select>
        <p class="erreur-champ" data-erreur="secteur"></p>
      </div>
      <div class="champ">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" maxlength="1000" placeholder="À quoi sert le projet, pour qui, ce que tu as fait…"></textarea>
        <p class="erreur-champ" data-erreur="description"></p>
      </div>
      <div class="champ">
        <label for="lien">Lien du projet</label>
        <input id="lien" name="lien" type="url" inputmode="url" autocapitalize="none" spellcheck="false" maxlength="300" placeholder="https://monprojet.com">
        <span class="aide">Facultatif. Palabre visitera ce lien pour vérifier qu'il fonctionne.</span>
        <p class="erreur-champ" data-erreur="lien"></p>
      </div>
      <div class="apercu-image" data-apercu hidden>
        <img alt="Aperçu de la capture d'écran" data-apercu-image>
        <button class="bouton bouton-lien" type="button" data-retirer-image>Retirer l'image</button>
      </div>
      <div class="actions-publier">
        <label class="bouton bouton-contour">
          Ajouter une capture d'écran
          <input type="file" accept="image/*" data-choisir-image class="visuellement-cache">
        </label>
      </div>
      <label class="case-a-cocher">
        <input type="checkbox" name="publierFacebook">
        <span>J'accepte que ce projet soit présenté sur la page Facebook « Palabre Dev ».</span>
      </label>
      <p class="message" role="status" data-message></p>
      <button class="bouton bouton-principal bouton-plein" type="submit">Ajouter le projet</button>
    </form>

    <section class="section-profil">
      <h2 data-titre-liste>Mes projets</h2>
      <p class="message" role="status" data-message-liste></p>
      <div class="liste-publications" data-liste aria-live="polite"></div>
      <div data-etat hidden></div>
    </section>
  </main>
</body>
</html>
