<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F3D22">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <title>Page introuvable – Palabre</title>
  <script src="/js/app.js" defer></script>
</head>
<!-- Page 404 : envoyée par le serveur (src/utils/statique.js, pageErreur) quand aucune page ne correspond à l'adresse. -->
<body>
  <div class="bande"></div>
  <header class="entete"><div class="conteneur entete-interieur">
    <a class="marque" href="/"><img src="/icons/logo-96.webp" alt="" width="32" height="32">Palabre</a>
    <nav data-nav></nav>
  </div></header>
  <main class="conteneur page-fil">
    <div class="vide page-erreur">
      <svg class="illustration" aria-hidden="true"><use href="/icons/illustrations.svg#recherche"></use></svg>
      <h1 class="vide-titre">Cette page n'existe pas</h1>
      <p>L'adresse est peut-être mal écrite, ou la page a été retirée.</p>
      <div class="erreur-actions">
        <a class="bouton bouton-principal" href="/">Retour à l'accueil</a>
        <a class="bouton bouton-contour" href="/chercher">Chercher un développeur</a>
      </div>
    </div>
  </main>
</body>
</html>
